<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Influencer Marketing Strateji Oluşturucu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 50px 0; margin-bottom: 30px; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; margin-bottom: 20px; }
        .card:hover { transform: translateY(-5px); }
        .influencer-img { width: 80px; height: 80px; background-color: #ddd; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #555; }
        .platform-badge { position: absolute; top: 10px; right: 10px; }
        .comment-box { background-color: #f1f3f5; padding: 10px; border-radius: 8px; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>

<div class="hero text-center">
    <div class="container">
        <h1>Influencer Marketing Stratejist</h1>
        <p class="lead">Markanız ve ürününüz için en uygun influencerları bulun.</p>
    </div>
</div>

<div class="container">
    <div class="row">
        <!-- Input Form -->
        <div class="col-md-4">
            <div class="card p-4">
                <h4>Strateji Detayları</h4>
                <form id="strategyForm">
                    <div class="mb-3">
                        <label for="brandName" class="form-label">Marka Adı</label>
                        <input type="text" class="form-control" id="brandName" placeholder="Örn: TechStore" required>
                    </div>
                    <div class="mb-3">
                        <label for="productType" class="form-label">Ürün Tipi</label>
                        <input type="text" class="form-control" id="productType" placeholder="Örn: Akıllı Saat, Spor Ayakkabı" required>
                    </div>
                    <div class="mb-3">
                        <label for="targetAudience" class="form-label">Hedef Kitle</label>
                        <input type="text" class="form-control" id="targetAudience" placeholder="Örn: Teknoloji severler, Gençler" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Ek Açıklama (Opsiyonel)</label>
                        <textarea class="form-control" id="description" rows="3" placeholder="Kampanya detayları..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Analiz Et ve Bul</button>
                </form>
            </div>
        </div>

        <!-- Results -->
        <div class="col-md-8">
            <div id="loading" class="text-center d-none">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Yükleniyor...</span>
                </div>
                <p class="mt-2">Veriler analiz ediliyor...</p>
            </div>
            
            <div id="resultsArea">
                <div class="alert alert-info">
                    Analiz sonuçlarını görmek için soldaki formu doldurun.
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('strategyForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const loading = document.getElementById('loading');
    const resultsArea = document.getElementById('resultsArea');
    
    // Show loading
    loading.classList.remove('d-none');
    resultsArea.innerHTML = '';

    const data = {
        brand_name: document.getElementById('brandName').value,
        product_type: document.getElementById('productType').value,
        target_audience: document.getElementById('targetAudience').value,
        description: document.getElementById('description').value
    };

    try {
        const response = await fetch('/api/analyze', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        if (!response.ok) throw new Error('Network response was not ok');

        const influencers = await response.json();
        
        loading.classList.add('d-none');
        
        if (influencers.length === 0) {
            resultsArea.innerHTML = '<div class="alert alert-warning">Eşleşen influencer bulunamadı.</div>';
            return;
        }

        let html = '<h4>Önerilen Influencerlar</h4>';
        
        influencers.forEach(inf => {
            const badgeColor = inf.platform === 'Instagram' ? 'bg-danger' : 
                               inf.platform === 'YouTube' ? 'bg-danger' : 
                               inf.platform === 'TikTok' ? 'bg-dark' : 'bg-primary';
            
            html += `
                <div class="card p-3">
                    <span class="badge ${badgeColor} platform-badge">${inf.platform}</span>
                    <div class="d-flex align-items-center mb-3">
                        <div class="influencer-img">${inf.name.charAt(0)}</div>
                        <div class="ms-3">
                            <h5 class="mb-0">${inf.name} <small class="text-muted">${inf.handle}</small></h5>
                            <small class="text-muted">${inf.niche.join(', ')}</small>
                        </div>
                        <div class="ms-auto text-end">
                            <div class="fw-bold">${inf.followers.toLocaleString()} Takipçi</div>
                            <div class="text-success">%${inf.engagement_rate} Etkileşim</div>
                        </div>
                    </div>
                    <p class="mb-2"><em>"${inf.bio}"</em></p>
                    
                    <h6 class="mt-2">Örnek Yorumlar (Son Gönderiler):</h6>
                    <div class="row">
                        ${inf.sample_comments.map(c => `<div class="col-md-4"><div class="comment-box">"${c}"</div></div>`).join('')}
                    </div>
                </div>
            `;
        });

        resultsArea.innerHTML = html;

    } catch (error) {
        console.error('Error:', error);
        loading.classList.add('d-none');
        resultsArea.innerHTML = '<div class="alert alert-danger">Bir hata oluştu. Lütfen tekrar deneyin.</div>';
    }
});
</script>

</body>
</html>
